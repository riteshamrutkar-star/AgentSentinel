user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request ID and upstream latency
    log_format sentinel_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'req_id="$sentinel_req_id" upstream_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log sentinel_combined;

    # Performance and TCP Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer Limits & DoS / Slowloris Mitigation
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # In-memory Rate Limiting Zone at the Ingress Layer (60 req/min per IP)
    # Note: Complements the backend application rate limiter
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=60r/m;
    limit_req_status 429;

    # Request ID resolution: preserve client X-Request-ID if provided, otherwise generate random
    map $http_x_request_id $sentinel_req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Upstream backend cluster
    upstream backend_nodes {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream frontend static server
    upstream dashboard_nodes {
        server dashboard:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:;" always;
        add_header X-Request-ID $sentinel_req_id always;

        # ----------------------------------------------------------------------
        # Backend API Routing (Rate-limited, buffered, forwarded headers)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_gateway_limit burst=20 nodelay;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $sentinel_req_id;
            proxy_set_header X-Correlation-ID $sentinel_req_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Health Probes (Direct pass-through, excluded from rate limits)
        # ----------------------------------------------------------------------
        location /health/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Prometheus Metrics Endpoint
        # ----------------------------------------------------------------------
        location /metrics {
            # In production, metrics may be restricted by IP:
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;

            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # Frontend Dashboard (Static SPA)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://dashboard_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Custom error page for rate limiting
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"detail": "Too Many Requests", "error": "rate_limit_exceeded", "retry_after": 60}';
        }
    }
}
